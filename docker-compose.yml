services:
  paisatrack:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-paisatrack}/expenditure-monitor:latest
    container_name: paisatrack-app
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - paisatrack_data:/app/data
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/finance.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  paisatrack_data:
    name: paisatrack_data
